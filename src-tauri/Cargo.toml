[package]
name = "local-chat"
version = "0.1.0"
description = "Chat: a local AI chat and coding app"
edition = "2024"

# The app is one binary. The tutorial creates src/main.rs in its first step.
[[bin]]
name = "local-chat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ureq = { version = "=3.5.0", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
